name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

# Trusted publishing: npm exchanges this job's OIDC token for a short-lived credential,
# so no NPM_TOKEN secret is stored on the repository. `id-token: write` is the whole
# permission the exchange needs; `contents: read` is all the checkout needs.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No dependencies and no build step: lib/ and template/ are the published files,
      # and they come straight from the tagged commit.
      - run: npm publish --provenance --access public
